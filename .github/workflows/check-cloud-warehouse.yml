# ANAC: validate the published DuckDB snapshot on a clean GitHub runner.
# Read-only verification. Does not refresh data or publish a Release.
name: ANAC - Cloud Warehouse Check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-warehouse:
    name: Verify DuckDB snapshot on GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download bootstrap DuckDB from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data_warehouse
          gh release download warehouse-bootstrap-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'anac.duckdb' \
            --dir data_warehouse \
            --clobber
          test -s data_warehouse/anac.duckdb

      - name: Verify tables and monthly parts (read-only check)
        shell: bash
        run: |
          set -euo pipefail
          python -c "import duckdb; c=duckdb.connect('data_warehouse/anac.duckdb', read_only=True); print('Fact rows:', c.execute('SELECT COUNT(*) FROM fact_airfare_route_monthly').fetchone()[0]); c.close()"
          python data_warehouse/incremental_warehouse.py --check
