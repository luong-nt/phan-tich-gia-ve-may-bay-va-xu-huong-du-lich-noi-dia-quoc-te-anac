# ANAC Brazil - update real public airfare CSVs and seat-weighted fare distributions.
# Daily at 12:23 Vietnam time (05:23 UTC); checks the ANAC index each run.
name: ANAC | Tu dong cap nhat ETL va Boxplot

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = kiem tra, khong ghi; update = cap nhat & commit neu co du lieu moi'
        required: true
        default: check
        type: choice
        options:
          - check
          - update

permissions:
  contents: write

concurrency:
  group: anac-auto-update-main
  cancel-in-progress: false

jobs:
  update-data:
    name: ANAC data refresh and validation
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Validate committed monthly data and Boxplot sync
        run: python scripts/validate_anac_auto_update.py

      - name: Check ANAC source links (manual check only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
        run: |
          python cap_nhat_anac.py --check
          python data_warehouse/cap_nhat_phan_phoi_gia.py --check

      - name: Update ANAC ETL (scheduled or manual update)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'update' }}
        run: python cap_nhat_anac.py

      - name: Update Boxplot from ANAC raw data (only pending months)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'update' }}
        run: python data_warehouse/cap_nhat_phan_phoi_gia.py --all

      - name: Validate entire committed-data snapshot
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'update' }}
        run: python scripts/validate_anac_auto_update.py

      - name: Run automated unit tests
        run: python -m pytest tests/ -q

      # Publish only approved derived files. Not the raw source files or DuckDB.
      - name: Commit and push only if data actually changed
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'update' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            DuLieu_DaXuLy/tong_hop_theo_thang_2024.csv \
            DuLieu_DaXuLy/top100_noi_dia_toa_do.csv \
            DuLieu_DaXuLy/top100_quoc_te_toa_do.csv \
            DuLieu_DaXuLy/xu_huong_diem_den_2024.csv \
            DuLieu_DaXuLy/trang_thai_cap_nhat.json \
            DuLieu_DaXuLy/_tu_dong/state.json \
            DuLieu_DaXuLy/_tu_dong/parts \
            data_warehouse/fare_distribution_by_month.csv \
            data_warehouse/fare_distribution_sync.json
          if git diff --cached --quiet; then
            echo 'ANAC: no data change, no commit necessary.'
          else
            git diff --cached --stat
            git commit -m 'data: auto-update ANAC ETL and fare distributions'
            git push origin HEAD:main
          fi
